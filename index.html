<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#3d8ef0" />
    <title>Sky Bounty: Catch The Treasure</title>
    <style>
      /* Декоративный шрифт DynaPuff загружается программно из src/game/fonts.ts,
         чтобы относительный путь корректно резолвился и в dev, и в Capacitor. */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        user-select: none;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #3d8ef0; /* совпадает с UI.background (PALETTE.blue) */
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        /* Фиксируем, чтобы WebView (Capacitor) не давал белых краёв
           и не смещался при появлении/скрытии системных панелей. */
        position: fixed;
        inset: 0;
      }

      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      canvas {
        display: block;
        touch-action: none;
      }

      /* Невидимый элемент для считывания CSS env(safe-area-inset-*). */
      #safe-area-probe {
        position: fixed;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        visibility: hidden;
        pointer-events: none;
        padding:
          env(safe-area-inset-top, 0px)
          env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px)
          env(safe-area-inset-left, 0px);
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="safe-area-probe"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
